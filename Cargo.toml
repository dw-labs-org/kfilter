[package]
name = "kfilter"
version = "0.5.0"
edition = "2021"
authors = ["Dom Wilson"]
description = "A no-std implementation of the Kalman and Extended Kalman Filter."
license = "MIT"
repository = "https://github.com/dw-labs-org/kfilter"
keywords = [
    "kalman_filter",
    "extended_kalman",
    "state_estimation",
    "estimator",
    "filtering",
]
categories = [
    "aerospace",
    "algorithms",
    "embedded",
    "no-std",
    "science::robotics",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
defmt = { version = "1", optional = true }
nalgebra = { version = "0.34", default-features = false, features = ["libm"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# plotters = "0.3.7"
rand = "0.8.5"
rand_distr = "0.4.3"

[features]
serde = ["dep:serde", "nalgebra/serde-serialize"]
std = ["nalgebra/std"]
defmt = ["dep:defmt", "nalgebra/defmt"]
